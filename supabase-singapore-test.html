<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATK Singapore Supabase Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Myanmar",sans-serif;background:#f5f7fb;color:#162033;margin:0;padding:24px}
.card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h2{color:#0b1f3a;margin-top:0}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#0b1f3a;color:#fff;font-size:16px;font-weight:700;margin-top:10px}
#result{margin-top:18px;padding:14px;border-radius:12px;background:#f8fafc;white-space:pre-wrap;word-break:break-word}
.small{font-size:13px;color:#6b7280}
</style>
</head>
<body>
<div class="card">
<h2>ATK Singapore Supabase Test</h2>
<p class="small">VPN OFF နဲ့စမ်းပါ။ ဒီ page က data မပြင်ပါဘူး။ Connection ပဲစမ်းပါမယ်။</p>
<button onclick="testHealth()">1. Test Singapore Health</button>
<button onclick="testREST()">2. Test Singapore Database API</button>
<div id="result">Ready.</div>
</div>
<script>
const URL='https://hzcsmlccxnartetvspmw.supabase.co';
const KEY='sb_publishable_cZFbEqJKhJfBMvKnEQezFg_MI0sNmpR';
const out=document.getElementById('result');

async function timedFetch(url, options={}, ms=15000){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms);
  try{return await fetch(url,{...options,signal:c.signal});}
  finally{clearTimeout(t);}
}

async function testHealth(){
  out.textContent='Testing Singapore Health...';
  try{
    const r=await timedFetch(URL+'/auth/v1/health',{},15000);
    const text=await r.text();
    out.textContent='SINGAPORE HEALTH RESULT\nHTTP '+r.status+'\n'+text;
  }catch(e){
    out.textContent='SINGAPORE HEALTH FAILED\n'+(e.name==='AbortError'?'15 second timeout':e.name+': '+e.message);
  }
}

async function testREST(){
  out.textContent='Testing Singapore Database API...';
  try{
    const r=await timedFetch(URL+'/rest/v1/',{
      headers:{apikey:KEY,Authorization:'Bearer '+KEY}
    },15000);
    const text=await r.text();
    out.textContent='SINGAPORE DATABASE API RESULT\nHTTP '+r.status+'\n'+text;
  }catch(e){
    out.textContent='SINGAPORE DATABASE API FAILED\n'+(e.name==='AbortError'?'15 second timeout':e.name+': '+e.message);
  }
}
</script>
</body>
</html>
