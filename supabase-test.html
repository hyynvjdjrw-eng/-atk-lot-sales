<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATK Supabase Test</title><style>body{font-family:-apple-system,sans-serif;background:#f5f7fb;padding:24px;color:#162033}.card{max-width:520px;margin:40px auto;background:#fff;padding:22px;border-radius:18px}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#0b1f3a;color:#fff;font-size:16px;font-weight:700}#r{margin-top:16px;padding:14px;background:#f1f5f9;border-radius:12px;white-space:pre-wrap;word-break:break-word}</style></head><body><div class="card"><h2>ATK Supabase Connection Test</h2><p>Database ကို မပြင်ပါ။ Connection ပဲ စမ်းပါမယ်။</p><button onclick="health()">1. Test Supabase Health</button><button onclick="rest()">2. Test Database API</button><div id="r">Ready.</div></div><script>
const U='https://njlvqfmrctadthqqlxzl.supabase.co',K='sb_publishable_DYAK4JJ5T6ClJ1SH1zH9dQ_LVjC6D4_',R=document.getElementById('r');
async function f(u,o={}){let c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{return await fetch(u,{...o,signal:c.signal})}finally{clearTimeout(t)}}
async function health(){R.textContent='Testing Health...';try{let x=await f(U+'/auth/v1/health'),t=await x.text();R.textContent='HEALTH RESULT\nHTTP '+x.status+'\n'+t}catch(e){R.textContent='HEALTH FAILED\n'+(e.name==='AbortError'?'15 second timeout':e.name+': '+e.message)}}
async function rest(){R.textContent='Testing Database API...';try{let x=await f(U+'/rest/v1/sales?select=id&limit=1',{headers:{apikey:K,Authorization:'Bearer '+K}}),t=await x.text();R.textContent='DATABASE API RESULT\nHTTP '+x.status+'\n'+t}catch(e){R.textContent='DATABASE API FAILED\n'+(e.name==='AbortError'?'15 second timeout':e.name+': '+e.message)}}
</script></body></html>
